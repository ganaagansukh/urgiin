<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профайл — Удмын хэлхээ</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: #12131a; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #dce8ff; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(6,12,24,0.97); border-bottom: 1px solid rgba(82,140,255,0.15); position: sticky; top: 0; z-index: 10; }
.nav a { color: #528cff; font-size: 0.88rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px; }
.nav-title { font-size: 0.62rem; letter-spacing: 0.12em; color: #1e3060; text-transform: uppercase; }
.hero { background: linear-gradient(155deg, #0a1530 0%, #060c18 65%); border-bottom: 2px solid #2a50c8; padding: 26px 20px 30px; display: flex; align-items: center; gap: 18px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: -50px; right: -30px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(82,140,255,0.1) 0%, transparent 70%); pointer-events: none; }
.hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #528cff, #a0c0ff, #528cff, transparent); }
.photo-side { flex-shrink: 0; position: relative; }
.photo-frame { width: 88px; height: 88px; border-radius: 16px; background: #0d1e3a; border: 2px solid #2a50c8; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 0 4px rgba(82,140,255,0.1), 4px 8px 28px rgba(0,0,0,0.6); }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; }
.age-tag { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #2a50c8, #528cff); color: #fff; font-size: 0.6rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.06em; box-shadow: 0 2px 10px rgba(82,140,255,0.5); }
.name-side { flex: 1; min-width: 0; padding-bottom: 4px; }
.ovog-tag { display: inline-block; font-size: 0.54rem; letter-spacing: 0.28em; text-transform: uppercase; color: #528cff; font-weight: 700; border: 1px solid rgba(82,140,255,0.3); background: rgba(82,140,255,0.06); padding: 2px 9px; border-radius: 4px; margin-bottom: 7px; }
.ner { font-size: 1.55rem; font-weight: 800; color: #fff; line-height: 1.1; margin-bottom: 6px; letter-spacing: -0.01em; text-shadow: 0 0 30px rgba(82,140,255,0.2); }
.born-line { font-size: 0.75rem; color: #2a4070; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.born-line strong { color: #7a9fd0; font-weight: 600; }
.bday-line { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #2a4070; margin-bottom: 4px; }
.bday-line .bday-val { color: #a0c0ff; font-weight: 600; }
.bday-line .bday-today { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a0a00; font-size: 0.55rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.08em; animation: pulse 1.5s ease-in-out infinite; }
.gender-pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: #2a4070; padding: 3px 10px; border: 1px solid #0d1e3a; border-radius: 20px; }
.sec-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #888; padding: 20px 16px 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
.loc-card { border-radius: 18px; padding: 18px 16px 16px; position: relative; overflow: hidden; min-height: 110px; display: flex; flex-direction: column; justify-content: flex-end; }
.loc-card.born    { background: linear-gradient(135deg, #c84b4b 0%, #e86060 100%); }
.loc-card.grown   { background: linear-gradient(135deg, #2a6e9a 0%, #3a8fc8 100%); }
.loc-card.current { grid-column: 1 / -1; background: linear-gradient(135deg, #3a6e3a 0%, #4a9a5a 100%); min-height: 90px; }
.loc-card::before { content: ''; position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: rgba(255,255,255,0.08); border-radius: 50%; }
.loc-type { font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.65); font-weight: 600; margin-bottom: 6px; }
.loc-name { font-size: 1.05rem; font-weight: 800; color: #fff; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.loc-name.empty { font-style: italic; font-size: 0.88rem; opacity: 0.5; font-weight: 400; }
.loc-icon { position: absolute; top: 14px; right: 14px; opacity: 0.25; }
.edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
.edu-card { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.edu-card.done    { background: #1a2a1a; border: 1px solid rgba(80,180,100,0.25); }
.edu-card.ongoing { background: #2a1e0a; border: 1px solid rgba(255,160,40,0.25); }
.edu-card.none    { background: #181820; border: 1px solid rgba(255,255,255,0.06); }
.edu-lv { font-size: 0.54rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; }
.edu-card.done    .edu-lv { color: #50b464; }
.edu-card.ongoing .edu-lv { color: #ffa028; }
.edu-card.none    .edu-lv { color: #3a3a4a; }
.edu-name { font-size: 0.82rem; font-weight: 700; color: #e8e8f0; line-height: 1.3; }
.edu-name.empty { color: #2a2a38; font-style: italic; font-weight: 400; font-size: 0.76rem; }
.edu-yr { font-size: 0.68rem; color: #555568; }
.edu-status { display: inline-block; font-size: 0.52rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; margin-top: 2px; align-self: flex-start; }
.edu-card.done    .edu-status { background: rgba(80,180,100,0.15); color: #50b464; }
.edu-card.ongoing .edu-status { background: rgba(255,160,40,0.15); color: #ffa028; }
.bday-popup { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 20px; }
.bday-popup.on { display: flex; animation: fadeIn 0.4s ease; }
.bday-box { background: linear-gradient(145deg, #1a1400, #0a0800); border: 2px solid #ffd700; border-radius: 24px; padding: 32px 24px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 0 60px rgba(255,215,0,0.2); }
.bday-emoji { font-size: 3rem; margin-bottom: 12px; animation: bounce 0.8s ease infinite alternate; }
.bday-title { font-size: 1.2rem; font-weight: 800; color: #ffd700; margin-bottom: 8px; }
.bday-text { font-size: 0.88rem; color: #c8a050; line-height: 1.5; margin-bottom: 20px; white-space: pre-line; }
.bday-close { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a0a00; font-size: 0.88rem; font-weight: 800; border: none; border-radius: 12px; padding: 12px 28px; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
@keyframes fadeIn { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
@keyframes pulse  { from{box-shadow:0 0 0 0 rgba(255,215,0,0.4)} to{box-shadow:0 0 0 6px rgba(255,215,0,0)} }
@keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-8px)} }
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Буцах
  </a>
  <span class="nav-title">Удмын хэлхээ</span>
  <div style="width:52px"></div>
</nav>
<div class="bday-popup" id="bdayPopup">
  <div class="bday-box">
    <div class="bday-emoji">🎂</div>
    <div class="bday-title">Төрсөн өдрийн мэнд!</div>
    <div class="bday-text" id="bdayMsg"></div>
    <button class="bday-close" onclick="document.getElementById('bdayPopup').classList.remove('on')">Баярлалаа 🎉</button>
  </div>
</div>
<div id="page"></div>
<script>
// ═══════════════════════════════════════════
// ГЭР БҮЛИЙН ГИШҮҮДИЙГ ЭНЭ ДОТОР НЭМНЭ
// Шинэ хүн нэмэхдээ доорх загварыг хуулаад
// "id001" гэхчлэн өөр id өгнө
// ═══════════════════════════════════════════
const members = {
  "id001": {
    ovog: "Батхорол",
    firstname: "Гансүх",
    birthYear: 1997, birthMonth: 1, birthDay: 25,
    deathYear: null,
    gender: "male", // "male" эсвэл "female"
    birthPlace: "Дархан хот",
    grownPlace: "Улаанбаатар",
    currentPlace: "Токио, Япон",
    photoUrl: "", // зургийн URL энд
    edu: [
      { level: "Бага",    school: "Дархан 3-р сургууль",   year: 1995, status: "done", profession: "" },
      { level: "Дунд",    school: "Дархан 3-р сургууль",   year: 2001, status: "done", profession: "" },
      { level: "Ахлах",   school: "", year: null, status: "none", profession: "" },
      { level: "Коллеж",  school: "", year: null, status: "none", profession: "" },
      { level: "Дээд",    school: "МУИС", year: 2010, status: "done", profession: "" },
      { level: "Магистр", school: "Токиогийн их сургууль", year: 2014, status: "done", profession: "" },
      { level: "Доктор",  school: "", year: null, status: "none", profession: "" },
    ]
  },
  // Шинэ хүн нэмэх жишээ:
  // "id002": {
  //   ovog: "Овог", firstname: "Нэр",
  //   birthYear: 1990, birthMonth: 3, birthDay: 15,
  //   deathYear: null, gender: "female",
  //   birthPlace: "", grownPlace: "", currentPlace: "",
  //   photoUrl: "",
  //   edu: [
  //     { level: "Бага",    school: "", year: null, status: "none", profession: "" },
  //     { level: "Дунд",    school: "", year: null, status: "none", profession: "" },
  //     { level: "Ахлах",   school: "", year: null, status: "none", profession: "" },
  //     { level: "Коллеж",  school: "", year: null, status: "none", profession: "" },
  //     { level: "Дээд",    school: "", year: null, status: "none", profession: "" },
  //     { level: "Магистр", school: "", year: null, status: "none", profession: "" },
  //     { level: "Доктор",  school: "", year: null, status: "none", profession: "" },
  //   ]
  // },
};

const MONTHS = ["","1-р сар","2-р сар","3-р сар","4-р сар","5-р сар","6-р сар","7-р сар","8-р сар","9-р сар","10-р сар","11-р сар","12-р сар"];

function checkBirthdays() {
  const today = new Date();
  const m = today.getMonth() + 1;
  const day = today.getDate();
  const hits = [];
  Object.values(members).forEach(p => {
    if (p.birthMonth === m && p.birthDay === day) {
      const age = today.getFullYear() - p.birthYear;
      hits.push(`${p.firstname} — ${age} нас хүрлээ!`);
    }
  });
  if (hits.length) {
    document.getElementById('bdayMsg').textContent = hits.join('\n');
    setTimeout(() => document.getElementById('bdayPopup').classList.add('on'), 700);
  }
}

const id = new URLSearchParams(location.search).get('id') || Object.keys(members)[0];
const d  = members[id];
const pg = document.getElementById('page');

if (!d) {
  pg.innerHTML = '<p style="text-align:center;color:#528cff;padding:60px">Мэдээлэл олдсонгүй</p>';
} else {
  render(d);
  checkBirthdays();
}

function render(d) {
  const today = new Date();
  const age = d.birthYear ? today.getFullYear() - d.birthYear : null;
  const isToday = d.birthMonth && d.birthDay && d.birthMonth === today.getMonth()+1 && d.birthDay === today.getDate();
  const bdayStr = d.birthMonth && d.birthDay ? `${MONTHS[d.birthMonth]} ${d.birthDay}` : null;

  pg.innerHTML += `
    <div class="hero">
      <div class="photo-side">
        <div class="photo-frame">
          ${d.photoUrl ? `<img src="${d.photoUrl}" alt="${d.firstname}">` : `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1a3060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`}
        </div>
        ${age ? `<div class="age-tag">${age} нас</div>` : ''}
      </div>
      <div class="name-side">
        <div class="ovog-tag">${d.ovog}</div>
        <div class="ner">${d.firstname}</div>
        <div class="born-line">${d.birthYear ? `<strong>${d.birthYear}</strong> онд төрсөн` : ''}${d.deathYear ? `<span>·</span><strong>${d.deathYear}</strong> онд нас барсан` : ''}</div>
        ${bdayStr ? `<div class="bday-line">🎂 <span class="bday-val">${bdayStr}</span>${isToday ? `<span class="bday-today">ӨНӨӨДӨР!</span>` : ''}</div>` : ''}
        <div class="gender-pill">${d.gender === 'female' ? '♀ Эмэгтэй' : '♂ Эрэгтэй'}</div>
      </div>
    </div>`;

  pg.innerHTML += `<div class="sec-label">📍 Газар байршил</div>
    <div class="grid">
      <div class="loc-card born">
        <div class="loc-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
        <div class="loc-type">Төрсөн газар</div>
        <div class="loc-name ${d.birthPlace?'':'empty'}">${d.birthPlace||'Тодорхойгүй'}</div>
      </div>
      <div class="loc-card grown">
        <div class="loc-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div class="loc-type">Өссөн газар</div>
        <div class="loc-name ${d.grownPlace?'':'empty'}">${d.grownPlace||'Тодорхойгүй'}</div>
      </div>
      <div class="loc-card current">
        <div class="loc-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
        <div class="loc-type">Оршин суугаа газар</div>
        <div class="loc-name ${d.currentPlace?'':'empty'}">${d.currentPlace||'Тодорхойгүй'}</div>
      </div>
    </div>`;

  pg.innerHTML += `<div class="sec-label">🎓 Боловсрол</div>`;
  const eduGrid = document.createElement('div');
  eduGrid.className = 'edu-grid';
  d.edu.forEach(e => {
    const has = e.school && e.school.trim();
    const st  = has ? e.status : 'none';
    const div = document.createElement('div');
    div.className = `edu-card ${st}`;
    div.innerHTML = `
      <div class="edu-lv">${e.level}</div>
      <div class="edu-name ${has?'':'empty'}">${has ? e.school : '—'}</div>
      ${has && e.profession ? `<div class="edu-yr" style="color:#8888aa;font-style:italic">📌 ${e.profession}</div>` : ''}
      ${has && e.year ? `<div class="edu-yr">${e.year} он</div>` : ''}
      ${has ? `<div class="edu-status">${e.status==='ongoing'?'Сурч байна':'Төгссөн'}</div>` : ''}
    `;
    eduGrid.appendChild(div);
  });
  pg.appendChild(eduGrid);
  pg.innerHTML += '<div style="height:40px"></div>';
}
</script>
</body>
</html>
