<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Удмын хэлхээ</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #05100d; }
#root {
  position: fixed; inset: 0;
  background-color: #05100d;
  overflow-y: auto;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.glow {
  position: absolute; top: -80px; left: 50%;
  transform: translateX(-50%);
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(72,255,167,0.08) 0%, transparent 68%);
  pointer-events: none;
}
.wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 390px;
  display: flex; flex-direction: column; align-items: center;
}
.header { text-align: center; margin-bottom: 30px; animation: fadeDown 0.7s ease both; }
.header h1 {
  font-size: 2rem; font-weight: 700; color: #48ffa7;
  font-family: Georgia, serif; letter-spacing: 0.02em;
  text-shadow: 0 0 22px rgba(72,255,167,0.5), 0 0 55px rgba(72,255,167,0.15);
}
.header .sub {
  margin-top: 7px; font-size: 0.6rem;
  letter-spacing: 0.3em; color: #4a8a6a; text-transform: uppercase;
}
.card {
  width: 100%; background-color: #0d211b;
  border: 1px solid rgba(72,255,167,0.2); border-radius: 22px;
  padding: 32px 26px 26px;
  box-shadow: 0 2px 0 rgba(72,255,167,0.06) inset, 0 12px 50px rgba(0,0,0,0.8);
  animation: fadeUp 0.8s 0.12s ease both;
  position: relative; overflow: hidden;
}
.lock-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
.lock-box {
  width: 54px; height: 54px; background-color: #071610;
  border: 1px solid rgba(72,255,167,0.28); border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  animation: lockGlow 3s ease-in-out infinite;
}
.fb-badge {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-bottom: 22px; font-size: 0.58rem;
  letter-spacing: 0.2em; color: #3d6e55; text-transform: uppercase;
}
.fb-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #48ffa7; flex-shrink: 0; }
.fb-name { color: #48ffa7; font-weight: 700; }
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 0.6rem; letter-spacing: 0.24em;
  color: #3d6e55; text-transform: uppercase; margin-bottom: 7px; font-weight: 600;
}
.iw { position: relative; }
.iw input {
  width: 100%; background-color: #081811;
  border: 1px solid rgba(72,255,167,0.16); border-radius: 10px;
  padding: 13px 44px 13px 14px; color: #c8f0dc;
  font-size: 1rem; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  outline: none; -webkit-appearance: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.iw input::placeholder { color: #234d38; }
.iw input:focus {
  border-color: rgba(72,255,167,0.48);
  box-shadow: 0 0 0 3px rgba(72,255,167,0.08);
}
.eye {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: #3d6e55;
  display: flex; align-items: center; -webkit-tap-highlight-color: transparent;
}
.err { display: none; color: #ff6b6b; font-size: 0.72rem; margin-top: 5px; }
.err.on { display: block; }
#fireErr { text-align: center; margin-bottom: 8px; font-size: 0.78rem; }
.btn {
  width: 100%; padding: 15px; border: none; border-radius: 12px;
  background: linear-gradient(130deg, #48ffa7 0%, #00d97e 100%);
  color: #041510; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.03em;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 24px rgba(72,255,167,0.3);
  transition: transform 0.15s; -webkit-tap-highlight-color: transparent; margin-top: 6px;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; }
.sp {
  display: none; width: 18px; height: 18px;
  border: 2px solid rgba(4,21,16,0.25); border-top-color: #041510;
  border-radius: 50%; animation: spin 0.65s linear infinite;
}
.btn.loading .lbl { display: none; }
.btn.loading .sp { display: block; }
.reg { text-align: center; margin-top: 17px; font-size: 0.82rem; color: #3d6e55; }
.reg a { color: #2ee88a; font-weight: 500; text-decoration: none; }
.sov {
  display: none; position: absolute; inset: 0;
  background-color: rgba(5,16,13,0.94); border-radius: 22px;
  flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.sov.on { display: flex; animation: fadeIn 0.3s ease; }
.sov p { color: #48ffa7; font-size: 0.9rem; letter-spacing: 0.1em; }
@keyframes fadeDown  { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeUp    { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes spin      { to{transform:rotate(360deg)} }
@keyframes lockGlow  {
  0%,100%{ box-shadow: 0 0 12px rgba(72,255,167,0.12); }
  50%    { box-shadow: 0 0 26px rgba(72,255,167,0.38); }
}
</style>
</head>
<body>
<div id="root">
  <div class="glow"></div>
  <div class="wrap">
    <div class="header">
      <h1>Удмын хэлхээ</h1>
      <p class="sub">Цахим ургийн бичиг</p>
    </div>
    <div class="card">
      <div class="lock-wrap">
        <div class="lock-box">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
               stroke="#48ffa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
      </div>
      <div class="fb-badge">
        <div class="fb-dot"></div>
        <span class="fb-name">Firebase</span>&nbsp;Authentication хамгаалалттай
      </div>
      <div class="field">
        <label>Таны ID</label>
        <div class="iw">
          <input type="text" id="uid" placeholder="ID" autocomplete="username" />
        </div>
        <p class="err" id="uidErr">ID оруулна уу</p>
      </div>
      <div class="field">
        <label>Нууц үг</label>
        <div class="iw">
          <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" />
          <button class="eye" id="eyeBtn" type="button">
            <svg id="eyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="err" id="pwErr">Нууц үг оруулна уу</p>
      </div>
      <p class="err" id="fireErr"></p>
      <button class="btn" id="loginBtn" type="button">
        <span class="lbl" style="display:flex;align-items:center;gap:8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Нэвтрэх
        </span>
        <div class="sp"></div>
      </button>
      <p class="reg">Бүртгэлгүй юу? <a href="#">Бүртгүүлэх</a></p>
      <div class="sov" id="sov">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none"
             stroke="#48ffa7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <p>Амжилттай нэвтэрлээ!</p>
      </div>
    </div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyBIoBE1qtOkkumkg1377A1a9LJAzVcafcY",
    authDomain:        "udmiin-helkhee.firebaseapp.com",
    databaseURL:       "https://udmiin-helkhee-default-rtdb.firebaseio.com",
    projectId:         "udmiin-helkhee",
    storageBucket:     "udmiin-helkhee.firebasestorage.app",
    messagingSenderId: "91518167241",
    appId:             "1:91518167241:web:3fdfd90c080b07df3d8518",
    measurementId:     "G-X1N4TX3YT9"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const uidEl  = document.getElementById('uid');
  const pwEl   = document.getElementById('pw');
  const btn    = document.getElementById('loginBtn');
  const uidErr = document.getElementById('uidErr');
  const pwErr  = document.getElementById('pwErr');
  const fErr   = document.getElementById('fireErr');
  const sovEl  = document.getElementById('sov');

  document.getElementById('eyeBtn').addEventListener('click', () => {
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    document.getElementById('eyeSvg').innerHTML = show
      ? `<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><circle cx="12" cy="12" r="3"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });

  btn.addEventListener('click', async () => {
    uidErr.classList.remove('on'); pwErr.classList.remove('on');
    fErr.classList.remove('on'); fErr.textContent = '';
    let ok = true;
    if (!uidEl.value.trim()) { uidErr.classList.add('on'); ok = false; }
    if (!pwEl.value)         { pwErr.classList.add('on');  ok = false; }
    if (!ok) return;
    const email = uidEl.value.trim().includes('@') ? uidEl.value.trim() : `${uidEl.value.trim()}@urgiin.mn`;
    btn.classList.add('loading'); btn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, email, pwEl.value);
      sovEl.classList.add('on');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    } catch (e) {
      btn.classList.remove('loading'); btn.disabled = false;
      const m = {
        'auth/user-not-found':    'Энэ ID бүртгэлгүй байна.',
        'auth/wrong-password':    'Нууц үг буруу байна.',
        'auth/invalid-credential':'ID эсвэл нууц үг буруу байна.',
        'auth/too-many-requests': 'Хэт олон оролдлого. Түр хүлээнэ үү.',
      };
      fErr.textContent = m[e.code] || e.message;
      fErr.classList.add('on');
    }
  });

  [uidEl, pwEl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); }));
</script>
</body>
</html>
